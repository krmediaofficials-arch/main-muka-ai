<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main MUKA AI</title>
<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        color: #111;
        overflow: hidden;
    }

    .app {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .header {
        height: 64px;
        min-height: 64px;
        background: #111;
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 24px;
    }

    .avatar {
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
    }

    .eye {
        width: 6px;
        height: 6px;
        background: #111;
        border-radius: 50%;
        margin: 0 3px;
    }

    .header-title {
        font-size: 17px;
        font-weight: 700;
    }

    .header-subtitle {
        margin-top: 2px;
        font-size: 11px;
        color: #fff;
        opacity: 0.65;
    }

    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 28px 20px;
    }

    .welcome {
        width: 100%;
        max-width: 760px;
        margin: 70px auto 25px;
        text-align: center;
    }

    .welcome h1 {
        margin: 0 0 10px;
        font-size: 30px;
        font-weight: 700;
    }

    .welcome p {
        margin: 0;
        color: #666;
        font-size: 15px;
        line-height: 1.5;
    }

    .message-row {
        width: 100%;
        max-width: 850px;
        margin: 0 auto 16px;
        display: flex;
    }

    .message-row.user {
        justify-content: flex-end;
    }

    .message {
        max-width: 75%;
        padding: 13px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .message.ai {
        background: #fff;
        border: 1px solid #e4e4e4;
        color: #111;
    }

    .message.user {
        background: #111;
        color: #fff;
    }

    .input-area {
        width: 100%;
        padding: 16px 20px 20px;
        background: #f5f5f5;
        flex-shrink: 0;
    }

    .input-box {
        width: 100%;
        max-width: 850px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 16px;
        padding: 8px;
    }

    #messageInput {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        padding: 11px 12px;
        background: transparent;
        color: #111;
        font-size: 14px;
    }

    #messageInput::placeholder {
        color: #999;
    }

    #sendButton {
        border: none;
        background: #111;
        color: #fff;
        border-radius: 11px;
        padding: 11px 20px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
    }

    #sendButton:hover {
        background: #222;
    }

    #sendButton:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .status {
        width: 100%;
        max-width: 850px;
        margin: 7px auto 0;
        color: #888;
        font-size: 11px;
    }

    @media (max-width: 600px) {
        .header {
            padding: 0 15px;
        }

        .messages {
            padding: 16px;
        }

        .welcome {
            margin-top: 45px;
        }

        .welcome h1 {
            font-size: 24px;
        }

        .welcome p {
            font-size: 14px;
        }

        .message {
            max-width: 88%;
        }

        .input-area {
            padding: 10px;
        }

        .input-box {
            border-radius: 14px;
        }

        #messageInput {
            padding: 10px;
        }

        #sendButton {
            padding: 10px 14px;
        }
    }

    @media (max-width: 380px) {
        .header {
            height: 60px;
            min-height: 60px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            min-width: 36px;
        }

        .header-title {
            font-size: 16px;
        }

        .header-subtitle {
            font-size: 10px;
        }

        .welcome h1 {
            font-size: 22px;
        }

        .message {
            font-size: 13px;
        }
    }
</style>

</head>

<body>
<div class="app">

    <header class="header">

        <div class="avatar">
            <span class="eye"></span>
            <span class="eye"></span>
        </div>

        <div>
            <div class="header-title">
                MUKA AI
            </div>

            <div class="header-subtitle">
                KR Media — Main AI
            </div>
        </div>

    </header>

    <main class="messages" id="messages">

        <div class="welcome" id="welcome">

            <h1>
                Hi, I'm MUKA AI 👋
            </h1>

            <p>
                Your central AI assistant for KR Media.
                How can I help you today?
            </p>

        </div>

    </main>

    <section class="input-area">

        <div class="input-box">

            <input
                id="messageInput"
                type="text"
                autocomplete="off"
                placeholder="Message MUKA AI..."
            >

            <button
                id="sendButton"
                type="button"
            >
                Send
            </button>

        </div>

        <div class="status" id="status">
            MUKA AI is ready.
        </div>

    </section>

</div>

<script>

    const API_BASE = "http://127.0.0.1:8000";
    const USER_ID = "main_user";

    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const status = document.getElementById("status");

    function addMessage(text, type) {

        if (welcome) {
            welcome.remove();
        }

        const row = document.createElement("div");

        row.className =
            "message-row " +
            (type === "user" ? "user" : "ai");

        const bubble = document.createElement("div");

        bubble.className =
            "message " +
            (type === "user" ? "user" : "ai");

        bubble.textContent = text;

        row.appendChild(bubble);
        messages.appendChild(row);

        messages.scrollTop = messages.scrollHeight;

        return row;
    }

    async function sendMessage() {

        const text = input.value.trim();

        if (!text || sendButton.disabled) {
            return;
        }

        addMessage(text, "user");

        input.value = "";

        sendButton.disabled = true;

        status.textContent = "MUKA is thinking...";

        const loading = addMessage("Thinking...", "ai");

        try {

            const response = await fetch(
                API_BASE + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify({
                        message: text,
                        user_id: USER_ID
                    })
                }
            );

            let data;

            try {
                data = await response.json();
            } catch (error) {
                throw new Error(
                    "Server returned invalid JSON."
                );
            }

            loading.remove();

            if (!response.ok) {
                throw new Error(
                    data?.detail ||
                    "MUKA backend error."
                );
            }

            if (
                !data.reply ||
                typeof data.reply !== "string"
            ) {
                throw new Error(
                    "MUKA returned an empty reply."
                );
            }

            addMessage(data.reply, "ai");

            status.textContent =
                "MUKA AI is ready.";

        } catch (error) {

            console.error(
                "MUKA ERROR:",
                error
            );

            loading.remove();

            addMessage(
                "Sorry, MUKA AI couldn't respond right now. Please try again.",
                "ai"
            );

            status.textContent =
                "Connection error.";

        } finally {

            sendButton.disabled = false;

            input.focus();
        }
    }

    sendButton.addEventListener(
        "click",
        sendMessage
    );

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );

</script>

</body>
</html>
